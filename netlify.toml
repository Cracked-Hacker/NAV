[build]
  command = "npm ci --ignore-scripts && npm run verify && npm audit --audit-level=high && npm run build"
  publish = ".site-build"

[build.environment]
  NODE_VERSION = "24"

# Keep HTML study-page downloads as real .html files, not rewritten pretty URLs.
[build.processing.html]
  pretty_urls = false

[[redirects]]
  from = "/account.html"
  to = "/account/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/account/*"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https://ljvusfrnrlcurzwxnlya.supabase.co; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"

# Finished-only release: the public Classroom route is a beta access information page,
# never a private course or a credential-bearing assessment.
[[headers]]
  for = "/classroom/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"

# Product downloads should save directly, never open an email or checkout flow.
[[headers]]
  for = "/downloads/*"
  [headers.values]
    Content-Disposition = "attachment"
    X-Content-Type-Options = "nosniff"
    X-Robots-Tag = "noindex"
    Cache-Control = "public, max-age=3600"
