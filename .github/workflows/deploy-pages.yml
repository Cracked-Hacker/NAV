name: Verify Netlify release source
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: npm audit --audit-level=high
      - run: npm run build
      - name: Verify canonical Netlify production artifact
        run: node scripts/verify-production.mjs
