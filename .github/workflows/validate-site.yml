name: Validate NAV public site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 15 * * 1"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install test dependencies
        run: npm ci --ignore-scripts

      - name: Verify account identity, isolation, recovery, and signup transport
        run: npm test

      - name: Run public-site release gate
        run: node scripts/validate-site.mjs

      - name: Run website CR truth, SEO, and routing gate
        run: node scripts/validate-public-cr.mjs

      - name: Build bounded public artifact
        run: npm run build

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Verify real pages at six widths and run accessibility audits
        run: node scripts/qa-release-browser.mjs

      - name: Measure Lighthouse against the packaged homepage
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory .site-build >/tmp/nav-public-site.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          npx --yes lighthouse@12.8.2 "http://127.0.0.1:4173/index.html" --quiet --chrome-flags="--headless --no-sandbox --disable-gpu" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=qa-screenshots/lighthouse-home.json
          node - <<'NODE'
          const report = require('./qa-screenshots/lighthouse-home.json');
          const scores = Object.fromEntries(Object.entries(report.categories).map(([key, value]) => [key, Math.round(value.score * 100)]));
          console.log('Lighthouse scores:', scores);
          const minimums = { performance: 85, accessibility: 90, 'best-practices': 90, seo: 90 };
          const failed = Object.entries(minimums).filter(([key, min]) => scores[key] < min);
          if (failed.length) {
            console.error('Browser audit thresholds failed:', failed.map(([key, min]) => `${key} ${scores[key]} < ${min}`).join(', '));
            process.exit(1);
          }
          NODE

      - name: Verify exact main commit and Classroom assessments on Netlify production
        if: github.event_name == 'push'
        run: node scripts/verify-classroom-production.mjs

      - name: Smoke-check live production and app routing
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          urls=(
            "https://coach-nate.netlify.app/"
            "https://coach-nate.netlify.app/nav-coach.html"
            "https://coach-nate.netlify.app/coaching.html"
            "https://coach-nate.netlify.app/classroom/"
            "https://coach-nate.netlify.app/science.html"
            "https://coach-nate.netlify.app/resources.html"
            "https://coach-nate.netlify.app/about.html"
            "https://coach-nate.netlify.app/contact.html"
            "https://coach-nate.netlify.app/terms.html"
            "https://coach-nate.netlify.app/privacy.html"
            "https://coach-nate.netlify.app/disclaimer.html"
            "https://coach-nate.netlify.app/sitemap.xml"
            "https://coach-nate.netlify.app/robots.txt"
            "https://nav-coach-app-eight.vercel.app/auth?mode=login"
          )
          for url in "${urls[@]}"; do
            echo "Checking $url"
            curl --fail --silent --show-error --location --retry 3 --retry-all-errors --max-time 30 "$url" >/dev/null
          done

      - name: Upload rendered QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-site-rendered-qa
          path: qa-screenshots/
          if-no-files-found: error
