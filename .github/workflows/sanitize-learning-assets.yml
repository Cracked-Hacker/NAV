name: Replace unsafe public learning assets

on:
  push:
    branches: [main]
    paths:
      - "scripts/sanitize-public-learning-assets.py"
      - ".github/workflows/sanitize-learning-assets.yml"

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact public website repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install local PDF and print-layout libraries
        run: python -m pip install --disable-pip-version-check "pymupdf==1.26.6" "reportlab==4.4.5"

      - name: Replace public PDFs and flashcard delivery formats, then verify
        run: python scripts/sanitize-public-learning-assets.py

      - name: Commit only the corrected downloadable assets
        run: |
          git config user.name "nav-asset-maintenance"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/NAV_Performance_Nutrition_The_Simple_Guide_v1-1.pdf \
                  downloads/NAV_Muscle_Cards.csv \
                  downloads/NAV_Muscle_Cards_Offline.html \
                  downloads/NAV_Muscle_Cards_Print.pdf \
                  downloads/NAV_Ultimate_Muscle_Card_Set.apkg \
                  downloads/NAV_Ultimate_Muscle_All_Formats_2026-11.zip
          if ! git diff --cached --quiet; then
            git commit -m "Replace EXOS-branded PDF copy and repair muscle card formats"
            git push origin HEAD:main
          fi
